[build-system]
requires = [
    "Cython>=3.0",
    "setuptools>=68",
    "wheel",
    "numpy>=1.26,<3",
]
build-backend = "setuptools.build_meta"

[project]
name = "gptff"
version = "1.0.1"
description = "Graph-based Pretrained Transformer Force Field."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Fankai Xie", email = "fankaixiee@gmail.com" }]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "ase>=3.26,<3.29",
    "torch>=2.4",
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "pymatgen>=2024.9.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "psutil>=5.9",
    "tqdm>=4.65",
]

[project.optional-dependencies]
torchsim = [
    "torch-sim-atomistic>=0.6",
    "h5py",
    "tables",
]
dev = [
    "build",
    "pytest",
]

[tool.setuptools.packages]
find = { include = ["gptff*"], exclude = ["test*"] }

[project.scripts]
gptff_trainer = "gptff.trainer.trainer:main"

[project.urls]
Homepage = "https://github.com/atomly-materials-research-lab/GPTFF"
